name: nx3000-tests

on:
  push:
    branches: ["**"]
    paths:
      - "nx3000-codeplug/**"
      - ".github/workflows/nx3000-tests.yml"
  pull_request:
    paths:
      - "nx3000-codeplug/**"
      - ".github/workflows/nx3000-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nx3000-codeplug
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run tests
        run: pytest -q
