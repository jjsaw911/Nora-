[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nora-nxdn"
version = "0.1.0"
description = "Clean-room NXDN protocol decoder for macOS + RTL-SDR (DSD-derived)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Joseph Sawyer" }]
keywords = ["nxdn", "sdr", "rtl-sdr", "dsd", "4fsk", "decoder", "radio"]
dependencies = ["numpy>=1.21"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nora-nxdn = "nora_nxdn.cli:main"

[project.urls]
Repository = "https://github.com/jjsaw911/nora-"

[tool.setuptools]
packages = ["nora_nxdn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
